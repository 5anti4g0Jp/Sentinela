name: Testes

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala libpcap (dependência do scapy)
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Roda os testes
        working-directory: backend
        run: python -m pytest tests/ -v
